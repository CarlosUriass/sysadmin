version: '3.8'

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: ${HOSTNAME}
    domainname: ${DOMAINNAME}
    env_file: .env
    ports:
      - "25:25"      # SMTP
      - "143:143"    # IMAP
      - "587:587"    # Submission
      - "993:993"    # IMAPS
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_RSPAMD=1     # Requisito de la práctica
      - ENABLE_FAIL2BAN=1   # Requisito de la práctica
      - ENABLE_POSTGREY=0
      - ENABLE_SASLAUTHD=0
      - ONE_DIR=1
      - SSL_TYPE=self-signed
      - OVERRIDE_HOSTNAME=${HOSTNAME}.${DOMAINNAME}
    restart: always
    cap_add:
      - NET_ADMIN # Requerido por Fail2Ban

  webmail-db:
    image: mariadb:10.11
    container_name: webmail-db
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: webmail
    restart: always
    env_file: .env
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=mysql
      - ROUNDCUBEMAIL_DB_HOST=webmail-db
      - ROUNDCUBEMAIL_DB_USER=${MYSQL_USER}
      - ROUNDCUBEMAIL_DB_PASSWORD=${MYSQL_PASSWORD}
      - ROUNDCUBEMAIL_DB_NAME=${MYSQL_DATABASE}
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mailserver
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,markasjunk
    depends_on:
      - webmail-db
      - mailserver
    volumes:
      - webmail_data:/var/www/html

  webmail-proxy:
    image: nginx:alpine
    container_name: webmail-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - webmail_certs:/etc/nginx/ssl
    depends_on:
      - webmail
    command: /bin/sh -c "if [ ! -f /etc/nginx/ssl/server.crt ]; then openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/server.key -out /etc/nginx/ssl/server.crt -subj '/C=MX/ST=State/L=City/O=Reprobados/CN=reprobados.com'; fi; nginx -g 'daemon off;'"

volumes:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:
  db_data:
  webmail_data:
  webmail_certs:
