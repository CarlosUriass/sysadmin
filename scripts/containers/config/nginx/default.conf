# ==============================================================================
# VirtualHost por defecto - Puerto 80
# Sirve contenido estatico personalizado (HTML, CSS, imagenes)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Pagina principal ---
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Recursos estaticos con cache ---
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- Directorio FTP compartido (archivos subidos via FTP) ---
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex on;
    }

    # --- HARDENING: Restringir metodos HTTP ---
    location / {
        limit_except GET POST {
            deny all;
        }
    }

    # --- Paginas de error personalizadas ---
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
