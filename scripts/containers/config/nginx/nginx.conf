# ==============================================================================
# Configuracion principal de Nginx - Hardened
# Elimina firmas del servidor y aplica headers de seguridad
# ==============================================================================

# Ejecutar worker processes con usuario no-root
user webuser webgroup;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    # --- Tipos MIME ---
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- HARDENING: Eliminar firmas del servidor ---
    server_tokens off;

    # --- Headers de seguridad ---
    add_header X-Frame-Options       "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header X-XSS-Protection      "1; mode=block"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Rendimiento ---
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;

    # --- Logging ---
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --- Compresion Gzip ---
    gzip on;
    gzip_types text/css application/javascript text/plain image/svg+xml;

    # --- Incluir configuraciones de sitios ---
    include /etc/nginx/conf.d/*.conf;
}
